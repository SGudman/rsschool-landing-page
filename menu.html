<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resource coffee house menu.">
    <link rel="icon" href="assets/icons/logo-light.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="product-modal.css">
    <title>Resource — Menu</title>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="index.html" aria-label="Resource Coffee House home">
        <img src="assets/icons/logo-light.svg" alt="Resource Coffee House">
      </a>
      <nav id="main-navigation" class="navigation" aria-label="Main navigation">
        <ul class="navigation-list">
          <li><a href="index.html#favorite">Favorite coffee</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#mobile-app">Mobile app</a></li>
          <li><a href="#contacts">Contact us</a></li>
          <li class="navigation-menu-item"><a href="menu.html" aria-current="page">Menu</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="theme-button" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
          <img src="assets/icons/theme-switch.svg" alt="">
        </button>
        <a class="menu-link" href="menu.html" aria-current="page">
          <span>Menu</span>
          <img src="assets/icons/menu-cup.svg" alt="">
        </a>
        <button
          class="burger-button"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="main-navigation"
        >
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main class="menu-main">
      <section class="menu" aria-labelledby="menu-title">
        <h1 id="menu-title">Behind each of our cups hides an <em>amazing surprise</em></h1>

        <div class="category-tabs" role="group" aria-label="Product categories">
          <button class="category-tab category-tab-active" type="button"><span class="category-icon" aria-hidden="true">☕</span>Coffee</button>
          <button class="category-tab" type="button"><span class="category-icon" aria-hidden="true">🫖</span>Tea</button>
          <button class="category-tab" type="button"><span class="category-icon" aria-hidden="true">🍰</span>Dessert</button>
        </div>

        <div class="product-grid"></div>

        <button class="show-more" type="button" aria-label="Show more products"><img src="assets/icons/refresh.svg" alt=""></button>
      </section>
    </main>

    <footer class="footer" id="contacts">
      <div class="footer-offer"><h2>Sip, Savor, Smile.<br><em>It’s coffee time!</em></h2><ul class="social-links" aria-label="Social networks"><li><a href="https://twitter.com/" target="_blank" rel="noreferrer" aria-label="Twitter"><img src="assets/icons/twitter.svg" alt=""></a></li><li><a href="https://www.instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram"><img src="assets/icons/instagram.svg" alt=""></a></li><li><a href="https://www.facebook.com/" target="_blank" rel="noreferrer" aria-label="Facebook"><img src="assets/icons/facebook.svg" alt=""></a></li></ul></div>
      <div class="contacts"><h3>Contact us</h3><address><a href="https://maps.google.com/?q=8558+Green+Rd+LA" target="_blank" rel="noreferrer"><img src="assets/icons/location.svg" alt=""><span>8558 Green Rd., LA</span></a><a href="tel:+16035550123"><img src="assets/icons/phone.svg" alt=""><span>+1 (603) 555-0123</span></a><p><img src="assets/icons/clock.svg" alt=""><span>Mon-Sat: 9:00 AM – 23:00 PM</span></p></address></div>
    </footer>

    <script src="script.js"></script>
    <script src="product-modal.js"></script>
    <script src="catalog.js"></script>
    <script>
      fetch("products.json")
        .then(function (response) {
          return response.json();
        })
        .then(function (products) {
          initCatalog(products);
        });
    </script>
  </body>
</html>
